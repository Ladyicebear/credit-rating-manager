<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>상품제안관리</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#F68121;--orange-d:#d65f0f;--orange-l:rgba(246,129,33,.15);
      --navy:#16335B;--ink:#1F2937;--muted:#8a92a0;--line:#E5E7EB;--white:#fff}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;
     background:#F4F6F8;color:var(--ink);padding:14px}
.wrap{max-width:1600px;margin:0 auto}

/* 상단 바: 기준월 + 필터 */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tb-label{font-size:11px;color:var(--muted);font-weight:700}
.msel{height:32px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:var(--ink);
      font-size:12.5px;font-weight:700;padding:0 8px;cursor:pointer}
.msel:focus{outline:none;border-color:var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #D5D9E0;background:#fff;border-radius:20px;padding:5px 12px;font-size:11.5px;
      font-weight:600;color:#4B5563;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--orange)}
.chip.on{background:#FCEAD8;color:#C77B2E;border-color:#F1C99E}
.chip .n{opacity:.7;font-weight:700;margin-left:3px;font-size:10.5px}
.search-wrap{display:flex;align-items:center;gap:6px}
.search-wrap input{height:32px;min-width:200px;border:1px solid #D5D9E0;border-radius:8px;
                   padding:0 10px;font-size:12.5px}
.search-wrap input:focus{outline:none;border-color:var(--orange)}
.prod-sel{height:32px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:var(--ink);
          font-size:12px;font-weight:700;padding:0 8px;cursor:pointer}
.prod-sel:focus{outline:none;border-color:var(--orange)}

/* 2단 레이아웃: 왼쪽 표 + 화살표 + 오른쪽 제안 */
.panes{display:grid;grid-template-columns:1fr 56px 0.8fr;gap:10px;align-items:stretch}
.pane{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pane-head{display:flex;align-items:center;justify-content:space-between;
           padding:10px 14px;border-bottom:1px solid var(--line)}
.pane-title{font-size:13px;font-weight:800;color:var(--navy)}
.pane-sub{font-size:11px;color:var(--muted);font-weight:600}
.tbl-scroll{overflow:auto;max-height:62vh}
table{width:100%;border-collapse:collapse;font-size:12px}
/* 왼쪽 DB제도 상품 표: 화면 진입 시 가로 스크롤 없이 모든 열이 보이도록 고정 폭.
   상품제공기관·상품구분은 좁히고 긴 이름은 …처리(제목 툴팁으로 전체 확인). */
.left-tbl{table-layout:fixed}
.left-tbl th,.left-tbl td{padding-left:4px;padding-right:4px}
.left-tbl td.l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th{position:sticky;top:0;background:#F1F3F5;color:#374151;font-weight:700;
         padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:8px;border-bottom:1px solid #F0F1F3;text-align:center;white-space:nowrap}
tbody tr:hover{background:#FFF9F2}
td.l{text-align:left}
td.org{font-weight:700;color:var(--ink)}
td.rate{font-weight:800;color:var(--orange-d);font-variant-numeric:tabular-nums}
.badge-sec{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.s-은행{background:#E7F0FF;color:#1D4ED8}.s-저축은행{background:#EAF7EE;color:#1c7a3f}
.s-생명보험{background:#FDECEC;color:#c0392b}.s-손해보험{background:#FCE9DA;color:#B8500F}
.s-증권{background:#EDE9FE;color:#6D28D9}.s-기타{background:#F1F3F5;color:#6B7280}
.none-row td{padding:32px;color:#9CA3AF;text-align:center}

/* 유니버스/판매가능 토글 */
.tgl{border:1px solid #D5D9E0;background:#fff;border-radius:6px;padding:2px 9px;font-size:11px;
     font-weight:700;cursor:pointer;font-family:inherit;min-width:34px}
.tgl.y{background:#EAF7EE;border-color:#bfe0cb;color:#1c7a3f}
.tgl.n{background:#F1F3F5;border-color:#d5d9e0;color:#9CA3AF}
.tgl.sell{background:#E7F0FF;border-color:#c5d8f5;color:#1D4ED8}
.tgl.nosell{background:#FDECEC;border-color:#f2c9c9;color:#c0392b}

/* 화살표 */
.arrow-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.arrow-btn{width:46px;height:46px;border:none;border-radius:12px;background:var(--navy);color:#fff;
           font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(22,51,91,.25)}
.arrow-btn:hover{background:#1f4576}
.arrow-btn:disabled{background:#c5cad3;cursor:default;box-shadow:none}
.arrow-hint{font-size:10px;color:var(--muted);text-align:center;line-height:1.4}

/* 오른쪽 제안 목록 */
td.del{cursor:pointer;color:#c0392b;font-weight:800}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{border:none;border-radius:8px;padding:8px 18px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:#1f4576}
/* 공지사항 입력(모바일 공지 버튼 팝업에 표시) */
.notice-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.notice-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.notice-tip{font-size:11.5px;color:var(--muted)}
.notice-tip b{color:var(--orange-d)}
.notice-box textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
                     font-family:inherit;font-size:13px;color:var(--ink);resize:vertical;min-height:88px;outline:none;line-height:1.5}
.notice-box textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
.notice-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}
.notice-upd{font-size:11.5px;color:var(--muted);margin-right:auto}
/* 증권사 ELB/DLB 발행정지기간 입력 */
.susp-list{display:grid;grid-template-columns:minmax(140px,max-content) auto 18px auto;justify-content:start;gap:9px 14px;align-items:center;font-size:13px}
.susp-list .susp-firm{font-weight:700;color:var(--navy)}
.susp-list input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none}
.susp-list input[type=date]:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
.susp-list .susp-tilde{color:var(--muted);text-align:center}
.susp-list .susp-hd{font-size:11.5px;color:var(--muted)}
.susp-none{color:var(--muted);font-size:12.5px;padding:6px 0}
/* 발행정지 카드: 내용 폭에 맞게 축소 + 저장 버튼 좌측 정렬 */
.susp-box{width:fit-content;max-width:100%}
.susp-box .notice-foot{justify-content:flex-start}
.susp-box .notice-upd{margin-right:0;margin-left:14px}
.btn-ghost{background:#fff;color:#4b5563;border:1px solid #d5d9e0}.btn-ghost:hover{background:#f4f6f8}
.chk{width:16px;height:16px;cursor:pointer;accent-color:var(--orange)}

/* 기준월 추가/삭제 버튼 */
.msel-btn{height:32px;border:1px solid #D5D9E0;background:#fff;border-radius:8px;padding:0 10px;
          font-size:12px;font-weight:700;color:#4B5563;cursor:pointer;font-family:inherit;white-space:nowrap}
.msel-btn:hover{border-color:var(--orange);color:var(--orange-d)}
.msel-btn.danger:hover{border-color:#e5b4b4;color:#c0392b}

/* 금리 없는(수기 생성) 기준월 안내 배너 */
.month-note{display:none;align-items:center;gap:8px;background:#FFF7ED;border:1px solid #F1C99E;
            border-radius:10px;padding:9px 13px;margin-bottom:10px;font-size:12.5px;color:#8a5622;line-height:1.5}
.month-note.show{display:flex}
.month-note b{color:#C2410C}

/* 제안목록 금리 직접 입력 */
input.rate-in{width:78px;height:28px;border:1px solid #D5D9E0;border-radius:6px;padding:0 8px;
              font-family:inherit;font-size:12.5px;font-weight:700;text-align:right;color:var(--ink);outline:none}
input.rate-in:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
input.rate-in.empty{border-color:#f0b8b8;background:#FFF5F5}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;
          align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:430px;box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}
.modal h3{margin:0;padding:14px 18px;font-size:14px;color:var(--navy);border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select{height:34px;border:1px solid #D5D9E0;border-radius:8px;padding:0 10px;
                       font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
.radio-row{display:flex;flex-direction:column;gap:7px}
.radio-row label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink);
                 font-weight:600;cursor:pointer;line-height:1.45}
.radio-row input{accent-color:var(--orange);margin-top:2px}
.radio-row .hint{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.radio-row .warn{color:#B91C1C}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FAFBFC}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);opacity:0;
       background:#16335B;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;
       box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;z-index:100;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#B91C1C}

@media(max-width:900px){
  .panes{grid-template-columns:1fr;gap:8px}
  .arrow-col{flex-direction:row;padding:4px 0}
  .arrow-btn{transform:rotate(90deg)}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 상단: 기준월 + 필터 -->
  <div class="topbar">
    <span class="tb-label">기준월</span>
    <select id="monthSel" class="msel"></select>
    <button class="msel-btn" id="btnAddMonth" onclick="openAddMonth()" title="금리 엑셀 업로드 없이 기준월을 만들어 제안상품을 입력합니다">＋ 기준월 추가</button>
    <button class="msel-btn danger" id="btnDelMonth" onclick="deleteMonth()" style="display:none" title="상품제안관리에서 만든 기준월을 삭제합니다">기준월 삭제</button>
    <span class="tb-label" style="margin-left:6px">업권</span>
    <div class="chips" id="secChips"></div>
    <div class="search-wrap" style="margin-left:auto">
      <input type="text" id="search" placeholder="기관·상품명 검색">
      <select id="prodSel" class="prod-sel" title="상품구분으로 검색">
        <option value="ALL">상품구분 ▾</option>
        <option value="정기예금">정기예금</option>
        <option value="ELB/DLB">ELB/DLB</option>
        <option value="이율보증형보험">이율보증형보험</option>
      </select>
    </div>
  </div>

  <!-- 금리 데이터 없이 만든 기준월 안내 -->
  <div class="month-note" id="monthNote"></div>

  <!-- 2단 레이아웃 -->
  <div class="panes">
    <!-- 왼쪽: DB제도 상품 목록 -->
    <div class="pane">
      <div class="pane-head">
        <span class="pane-title">DB제도 상품</span>
        <span class="pane-sub" id="leftSub">0건</span>
      </div>
      <div class="tbl-scroll">
        <table class="left-tbl">
          <colgroup>
            <col style="width:32px"><col style="width:52px"><col style="width:15%"><col style="width:14%">
            <col style="width:60px"><col style="width:86px"><col style="width:78px"><col style="width:48px"><col style="width:56px">
          </colgroup>
          <thead><tr>
            <th><input type="checkbox" class="chk" id="chkAll" title="전체 선택"></th>
            <th>업권</th><th>상품제공기관</th><th>상품구분</th>
            <th>유니버스<br>(Y/N)</th><th>연컨사전확인<br>(Y/N)</th><th>판매가능여부</th><th>기간</th><th>금리</th>
          </tr></thead>
          <tbody id="leftBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 화살표 -->
    <div class="arrow-col">
      <button class="arrow-btn" id="addBtn" title="선택 상품을 제안 목록으로" onclick="addSelected()">▶</button>
      <div class="arrow-hint">선택 →<br>제안</div>
    </div>

    <!-- 오른쪽: 이달의 제안상품 -->
    <div class="pane">
      <div class="pane-head">
        <span class="pane-title">이달의 제안상품</span>
        <span class="pane-sub" id="rightSub">0건</span>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead><tr>
            <th>상품제공기관</th><th>상품구분</th><th>기간</th><th>금리</th><th style="width:38px"></th>
          </tr></thead>
          <tbody id="rightBody"></tbody>
        </table>
      </div>
      <div class="foot">
        <button class="btn btn-ghost" style="margin-right:auto" onclick="openManualAdd()" title="목록에 없는 상품을 직접 입력해 제안목록에 추가">＋ 직접 추가</button>
        <button class="btn btn-ghost" onclick="reloadProposals()" title="저장된 제안 목록 다시 불러오기">수정</button>
        <button class="btn btn-navy" onclick="registerProposals()" title="현재 제안 목록을 이 기준월로 저장">등록</button>
      </div>
    </div>
  </div>

  <!-- 공지사항 입력 (모바일 제안카드 「공지」 버튼 팝업에 표시) -->
  <div class="notice-box">
    <div class="notice-head">
      <span class="pane-title">공지사항</span>
      <span class="notice-tip">모바일 「이달의 제안 가능 상품」의 <b>공지</b> 버튼 팝업에 표시됩니다</span>
    </div>
    <textarea id="noticeText" rows="4" placeholder="공지사항 내용을 입력하세요 (여러 줄 가능)"></textarea>
    <div class="notice-foot">
      <span id="noticeUpd" class="notice-upd"></span>
      <button class="btn btn-navy" onclick="saveNotice()">공지 저장</button>
    </div>
  </div>

  <!-- 증권사 ELB/DLB 발행정지기간 (모바일 상세 팝업에 표시) -->
  <div class="notice-box susp-box">
    <div class="notice-head">
      <span class="pane-title">증권사 ELB/DLB 발행정지기간</span>
      <span class="notice-tip">기관별 <b>시작일~종료일</b> → 모바일 상세 팝업에 표시</span>
    </div>
    <div id="suspList" class="susp-list"></div>
    <div class="notice-foot">
      <button class="btn btn-navy" onclick="saveSuspension()">발행정지기간 저장</button>
      <span id="suspUpd" class="notice-upd"></span>
    </div>
  </div>
</div>

<!-- 기준월 추가 모달: 금리 엑셀을 다시 올릴 수 없을 때 그 달을 만들어 제안상품을 입력한다 -->
<div class="modal-bg" id="addMonthBg">
  <div class="modal">
    <h3>기준월 추가</h3>
    <div class="modal-body">
      <div class="fld">
        <label>기준월 (YYYY-MM)</label>
        <input type="month" id="amMonth">
      </div>
      <div class="fld">
        <label>상품목록 가져올 기준월</label>
        <select id="amCopyFrom"></select>
      </div>
      <div class="fld">
        <label>가져오는 방식</label>
        <div class="radio-row">
          <label><input type="radio" name="amMode" value="structure" checked>
            <span>상품목록만 가져오기 <span class="hint">금리는 비워 둡니다(권장). 제안목록에서 이 달의 금리를 직접 입력합니다.</span></span></label>
          <label><input type="radio" name="amMode" value="rates">
            <span>금리까지 그대로 복사 <span class="hint warn">지난달 금리가 이 달 금리로 표시됩니다. 실제 금리와 다를 수 있으니 주의하세요.</span></span></label>
          <label><input type="radio" name="amMode" value="empty">
            <span>빈 목록으로 만들기 <span class="hint">왼쪽 상품목록 없이, 제안상품을 「＋ 직접 추가」로만 입력합니다.</span></span></label>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('addMonthBg')">취소</button>
      <button class="btn btn-navy" onclick="createMonth()">기준월 만들기</button>
    </div>
  </div>
</div>

<!-- 제안상품 직접 입력 모달 -->
<div class="modal-bg" id="manualBg">
  <div class="modal">
    <h3>제안상품 직접 추가</h3>
    <div class="modal-body">
      <div class="fld"><label>업권</label>
        <select id="mnSector"></select></div>
      <div class="fld"><label>상품제공기관</label>
        <input type="text" id="mnOrg" placeholder="예: 국민은행"></div>
      <div class="fld"><label>상품구분</label>
        <input type="text" id="mnFam" placeholder="예: 정기예금 / ELB / 이율보증형보험"></div>
      <div class="fld"><label>기간</label>
        <select id="mnMonths"></select></div>
      <div class="fld"><label>금리(%)</label>
        <input type="number" id="mnRate" step="0.01" min="0" placeholder="예: 3.25"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('manualBg')">취소</button>
      <button class="btn btn-navy" onclick="addManual()">제안목록에 추가</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const MONTHS=[3,6,12,18,24,30,36,48,60];
const MONTH_LABEL={3:'3개월',6:'6개월',12:'1년',18:'18개월',24:'2년',30:'30개월',36:'3년',48:'4년',60:'5년'};
const SECTOR_ORDER=['은행','저축은행','생명보험','손해보험','증권','기타'];

let STORE={};          // pension_store 전체 {month:{rows,...}}
let META={};           // 상품키 -> {universe,sellable}
let PROPOSALS={};      // 기준월 -> [items]
let curMonth='';       // 선택 기준월
let dbRows=[];         // 현재 월의 DB제도 상품(평탄화)
let filterSec='ALL';
let prodFilter='ALL';
let searchTxt='';
let selected=[];       // 오른쪽 제안 목록(작업 중)

function htmlEsc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function toast(m,t){const el=$('toast');el.textContent=m;el.className='show'+(t?' '+t:'');clearTimeout(el._t);el._t=setTimeout(()=>el.className='',2600);}
function fmtRate(v){return (typeof v==='number')?v.toFixed(2)+'%':(v==null?'-':v);}

/* app.py 주석의 상품키 규칙과 동일해야 함: sector|org|fam|months */
function rowKey(r){return [r.sector,r.org,r.fam,r.months].join('|');}

/* ---------- 초기 로드 ---------- */
async function boot(){
  try{
    const [ps,mt,pr]=await Promise.all([
      fetch('/api/pension_store').then(r=>r.json()),
      fetch('/api/proposal_meta').then(r=>r.json()),
      fetch('/api/proposals').then(r=>r.json()),
    ]);
    STORE=ps||{}; META=mt||{}; PROPOSALS=pr||{};
  }catch(e){ toast('데이터를 불러오지 못했습니다','err'); return; }

  bindFilters();
  bindModals();
  $('monthSel').onchange=()=>{ selectMonth($('monthSel').value); };
  applyStore({initial:true});
  loadNotice();
  loadSuspension();
  watchNewUploads();
}

/* ---------- 기준월 목록 / 자동 반영 ----------
   기준월 선택지는 서버에 저장된 금리 데이터(pension_store)의 월 키에서 만든다.
   → 금리 화면에서 그 달 엑셀을 업로드하면 여기 기준월도 자동으로 생기고, 그 달로 전환된다. */
function storeMonths(){ return Object.keys(STORE).sort(); }

function refreshMonthSel(){
  const months=storeMonths();
  $('monthSel').innerHTML=months.map(m=>`<option value="${m}">${m}</option>`).join('');
  $('monthSel').value=curMonth;
  $('monthSel').disabled=!months.length;
}

/* 기준월 전환(사용자 선택 / 자동 전환 공통) */
function selectMonth(m){
  if(!m || m===curMonth) return;
  curMonth=m;
  $('monthSel').value=m;
  renderMonthView();
}

/* 선택된 기준월 기준으로 화면 전체(상품목록·업권칩·제안목록·발행정지) 다시 그림 */
function renderMonthView(){
  buildDbRows();
  loadProposalsForMonth();
  renderSecChips();     // 업권별 건수는 월마다 다르므로 함께 갱신
  render();
  renderSuspension();
  renderMonthNote();
}

/* 금리 엑셀 없이 만든 기준월이면 안내 배너 + 삭제 버튼 노출 */
function renderMonthNote(){
  const e=STORE[curMonth]||{};
  const note=$('monthNote'), del=$('btnDelMonth');
  const made = e.createdBy==='proposal';
  del.style.display = made ? '' : 'none';
  if(!made){ note.className='month-note'; note.innerHTML=''; return; }
  let msg;
  if(e.rateless && e.copiedFrom) msg=`<b>${curMonth}</b>은 금리 엑셀 없이 만든 기준월입니다. 상품목록은 <b>${e.copiedFrom}</b>에서 가져왔고 <b>금리는 비어 있습니다</b> — 제안목록의 금리를 직접 입력해 등록하세요.`;
  else if(e.rateless)            msg=`<b>${curMonth}</b>은 금리 엑셀 없이 만든 빈 기준월입니다. 제안상품은 「＋ 직접 추가」로 입력하세요.`;
  else                           msg=`<b>${curMonth}</b>은 금리 엑셀 없이 만든 기준월이고, 금리는 <b>${e.copiedFrom}</b>에서 그대로 복사한 값입니다. 실제 금리와 다를 수 있으니 제안목록의 금리를 확인·수정하세요.`;
  note.className='month-note show'; note.innerHTML=msg;
}

/* ---------- 기준월 추가/삭제 (금리 파일을 다시 올릴 수 없을 때) ---------- */
function closeModal(id){ $(id).classList.remove('show'); }
function nextMonthOf(m){
  const t=/^(\d{4})-(\d{2})$/.exec(m||'');
  const d = t ? new Date(+t[1], +t[2], 1) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function openAddMonth(){
  const months=storeMonths();
  $('amMonth').value = nextMonthOf(months[months.length-1]||'');
  $('amCopyFrom').innerHTML = months.length
    ? months.slice().reverse().map(m=>`<option value="${m}">${m}</option>`).join('')
    : '<option value="">(가져올 기준월 없음)</option>';
  $('amCopyFrom').disabled=!months.length;
  const radios=[...document.querySelectorAll('input[name=amMode]')];
  radios.forEach(r=>{ r.disabled = !months.length && r.value!=='empty'; });
  (months.length ? radios[0] : radios[2]).checked=true;
  $('addMonthBg').classList.add('show');
  setTimeout(()=>$('amMonth').focus(),50);
}
async function createMonth(){
  const month=($('amMonth').value||'').trim();
  const mode=(document.querySelector('input[name=amMode]:checked')||{}).value||'structure';
  const copyFrom=mode==='empty'?'':$('amCopyFrom').value;
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)){ toast('기준월을 YYYY-MM 형식으로 입력하세요','err'); return; }
  if(STORE[month]){ toast(`${month} 기준월이 이미 있습니다`,'err'); return; }
  if(mode!=='empty' && !copyFrom){ toast('상품목록을 가져올 기준월을 선택하세요','err'); return; }
  try{
    const d=await fetch('/api/pension_month',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({month,copyFrom,mode})}).then(r=>r.json());
    if(!d.success){ toast(d.message||'기준월 생성 실패','err'); return; }
    closeModal('addMonthBg');
    await reloadStore({force:month});
    toast(`${month} 기준월을 만들었습니다 (상품 ${d.rows}건). 제안상품을 입력한 뒤 「등록」을 누르세요.`);
  }catch(e){ toast('서버와 통신하지 못했습니다','err'); }
}
async function deleteMonth(){
  const e=STORE[curMonth]||{};
  if(e.createdBy!=='proposal'){ toast('금리 엑셀로 업로드된 기준월은 삭제할 수 없습니다','err'); return; }
  if(!confirm(`${curMonth} 기준월과 그 달에 등록된 제안상품을 삭제합니다. 계속할까요?`)) return;
  try{
    const d=await fetch('/api/pension_month/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({month:curMonth})}).then(r=>r.json());
    if(!d.success){ toast(d.message||'삭제 실패','err'); return; }
    delete PROPOSALS[curMonth]; selected=[]; curMonth='';
    await reloadStore();
    toast(`${d.month} 기준월을 삭제했습니다`);
  }catch(e){ toast('서버와 통신하지 못했습니다','err'); }
}

/* ---------- 제안상품 직접 입력 ---------- */
function openManualAdd(){
  if(!curMonth){ toast('먼저 기준월을 만들거나 선택하세요','err'); return; }
  $('mnSector').innerHTML=SECTOR_ORDER.map(s=>`<option value="${s}">${s}</option>`).join('');
  $('mnMonths').innerHTML=MONTHS.map(m=>`<option value="${m}">${MONTH_LABEL[m]}</option>`).join('');
  $('mnMonths').value='12';
  $('mnOrg').value=''; $('mnFam').value=''; $('mnRate').value='';
  $('manualBg').classList.add('show');
  setTimeout(()=>$('mnOrg').focus(),50);
}
function addManual(){
  const org=$('mnOrg').value.trim(), fam=$('mnFam').value.trim();
  if(!org){ toast('상품제공기관을 입력하세요','err'); return; }
  if(!fam){ toast('상품구분을 입력하세요','err'); return; }
  const months=+$('mnMonths').value;
  const rv=$('mnRate').value.trim();
  const rate = rv===''? null : Math.round(parseFloat(rv)*100)/100;
  const item={sector:$('mnSector').value, org, fam, months, period:MONTH_LABEL[months],
              rate:(rate!=null&&isNaN(rate))?null:rate, manual:true};
  if(selected.some(sx=>rowKey(sx)===rowKey(item))){ toast('이미 제안목록에 있는 상품입니다','err'); return; }
  selected.push(item);
  closeModal('manualBg');
  render();
  toast(`${org} ${fam} ${item.period}을(를) 제안목록에 추가했습니다`);
}

/* 저장된 제안목록과 현재 작업목록이 다르면 '작업 중'(등록 전) */
function hasUnsavedWork(){
  return JSON.stringify(selected)!==JSON.stringify(PROPOSALS[curMonth]||[]);
}

/* STORE를 화면에 반영. 새 기준월이 생겼으면 그 달로 자동 전환한다. */
function applyStore(opt){
  opt=opt||{};
  const months=storeMonths();
  const empty=$('leftBody');
  if(!months.length){
    curMonth=''; refreshMonthSel(); renderMonthNote();
    if(empty) empty.innerHTML='<tr class="none-row"><td colspan="9">업로드된 원리금 금리 데이터가 없습니다. 금리 화면에서 엑셀을 업로드하거나, 위 「＋ 기준월 추가」로 기준월을 만들어 제안상품을 직접 입력하세요.</td></tr>';
    return;
  }
  // 기준월을 새로 만든 직후 등 그 달로 바로 전환해야 할 때
  if(opt.force && STORE[opt.force]){
    curMonth=opt.force; refreshMonthSel(); renderMonthView(); return;
  }
  const latest=months[months.length-1];
  const isNew = !!curMonth && latest!==curMonth && !opt.initial;

  // 등록 전 작업 내용이 있으면 임의로 달을 바꾸지 않는다(작업분 유실 방지). 목록에만 추가하고 알림.
  if(isNew && hasUnsavedWork()){
    refreshMonthSel();
    toast(`${latest.replace('-','년 ')}월 금리가 업로드됐습니다. 작업 중인 제안목록이 있어 기준월은 그대로 둡니다(기준월에서 선택).`);
    return;
  }

  if(!curMonth || !STORE[curMonth] || isNew) curMonth=latest;
  refreshMonthSel();
  renderMonthView();
  if(isNew) toast(`${latest.replace('-','년 ')}월 금리가 업로드되어 기준월을 ${latest}(으)로 변경했습니다`);
}

/* 서버의 전체 금리 데이터를 다시 받아 반영. opt.force 를 주면 그 기준월로 바로 전환 */
async function reloadStore(opt){
  try{
    const ps=await fetch('/api/pension_store',{cache:'no-store'}).then(r=>r.json());
    if(!ps || typeof ps!=='object') return;
    STORE=ps;
    applyStore(opt);
  }catch(e){ /* 통신 실패 시 다음 주기에 재시도 */ }
}

/* 새 기준월 업로드 감지
   1) 같은 브라우저의 금리 화면 탭에서 업로드 → storage 이벤트로 즉시
   2) 다른 기기/사람이 업로드 → 가벼운 /api/pension_months 폴링(60초, 화면이 보일 때만)
   3) 탭을 다시 열거나 창에 포커스가 돌아올 때 즉시 확인 */
function watchNewUploads(){
  let known=storeMonths().join(',');

  async function checkMonths(){
    if(document.hidden) return;
    try{
      const d=await fetch('/api/pension_months',{cache:'no-store'}).then(r=>r.json());
      const sig=(d&&d.months||[]).map(x=>x.month).sort().join(',');
      if(sig && sig!==known){ known=sig; await reloadStore(); }
    }catch(e){}
  }

  window.addEventListener('storage', e=>{
    if(e.key==='pension_store_updated') reloadStore().then(()=>{ known=storeMonths().join(','); });
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkMonths(); });
  window.addEventListener('focus', checkMonths);
  setInterval(checkMonths, 60000);
}

/* ---------- 공지사항 ---------- */
function loadNotice(){
  fetch('/api/notice').then(r=>r.json()).then(d=>{
    $('noticeText').value=(d&&d.text)||'';
    $('noticeUpd').textContent=(d&&d.updated_at)?('마지막 저장: '+d.updated_at):'';
  }).catch(()=>{});
}
function saveNotice(){
  const text=$('noticeText').value;
  fetch('/api/notice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.success){ $('noticeUpd').textContent='마지막 저장: '+d.updated_at; toast('공지사항을 저장했습니다'); }
      else toast((d&&d.message)||'저장 실패(권한 확인)','err');
    }).catch(()=>toast('서버 통신 실패','err'));
}

/* ---------- 증권사 ELB/DLB 발행정지기간 ---------- */
let SUSP={};   // {org:{start,end}}
function loadSuspension(){
  fetch('/api/issue_suspension').then(r=>r.json()).then(d=>{ SUSP=d||{}; renderSuspension(); }).catch(()=>{});
}
function securitiesElbFirms(){
  const set=new Set();
  dbRows.forEach(r=>{ if(r.sector==='증권' && /ELB|DLB/.test(String(r.fam))) set.add(r.org); });
  return [...set].sort((a,b)=>String(a).localeCompare(b,'ko'));
}
function renderSuspension(){
  const el=$('suspList'); if(!el) return;
  const firms=securitiesElbFirms();
  if(!firms.length){ el.className=''; el.innerHTML='<div class="susp-none">현재 기준월에 증권사 ELB/DLB 상품이 없습니다.</div>'; return; }
  el.className='susp-list';
  el.innerHTML=
    '<div class="susp-hd">기관</div><div class="susp-hd" style="text-align:center">시작일</div><div></div><div class="susp-hd" style="text-align:center">종료일</div>'+
    firms.map(org=>{
      const v=SUSP[org]||{}; const k=htmlEsc(org);
      return `<div class="susp-firm">${htmlEsc(org)}</div>`+
             `<input type="date" data-org="${k}" data-f="start" value="${htmlEsc(v.start||'')}">`+
             `<div class="susp-tilde">~</div>`+
             `<input type="date" data-org="${k}" data-f="end" value="${htmlEsc(v.end||'')}">`;
    }).join('');
}
function saveSuspension(){
  const map={};
  document.querySelectorAll('#suspList input[type=date]').forEach(inp=>{
    const org=inp.dataset.org, f=inp.dataset.f;
    (map[org]=map[org]||{})[f]=inp.value||'';
  });
  fetch('/api/issue_suspension',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({map})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.success){ SUSP=map; toast('발행정지기간을 저장했습니다'); }
      else toast((d&&d.message)||'저장 실패(권한 확인)','err');
    }).catch(()=>toast('서버 통신 실패','err'));
}

/* ---------- DB제도 상품 평탄화(만기별 1행) ---------- */
function buildDbRows(){
  dbRows=[];
  const e=STORE[curMonth]; if(!e||!Array.isArray(e.rows)) return;
  const rateless=!!e.rateless;   // 금리 없이 상품목록만 만든 달 → 금리는 '-'로 두고 상품은 표시
  for(const r of e.rows){
    const db=r.db||{};
    for(const m of MONTHS){
      const has=Object.prototype.hasOwnProperty.call(db,m)||Object.prototype.hasOwnProperty.call(db,String(m));
      const v=db[m];
      if(v==null && !(rateless && has)) continue;
      dbRows.push({sector:r.sector,org:r.org,fam:r.fam,months:m,period:MONTH_LABEL[m],rate:(v==null?null:v)});
    }
  }
  dbRows.sort((a,b)=>{
    const s=SECTOR_ORDER.indexOf(a.sector)-SECTOR_ORDER.indexOf(b.sector);
    if(s!==0) return s;
    const o=String(a.org).localeCompare(b.org,'ko'); if(o!==0) return o;
    return a.months-b.months;
  });
}

/* ---------- 필터 ---------- */
function prodMatch(fam){
  if(prodFilter==='ALL') return true;
  const f=String(fam||'');
  if(prodFilter==='정기예금') return /정기예금/.test(f);
  if(prodFilter==='ELB/DLB') return /ELB|DLB/.test(f);
  if(prodFilter==='이율보증형보험') return /이율보증형/.test(f);
  return true;
}
function filteredRows(){
  const q=searchTxt.trim().toLowerCase();
  return dbRows.filter(r=>{
    if(filterSec!=='ALL' && r.sector!==filterSec) return false;
    if(!prodMatch(r.fam)) return false;
    if(q && (String(r.org)+' '+String(r.fam)).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function renderSecChips(){
  const cnt={}; SECTOR_ORDER.forEach(s=>cnt[s]=0);
  dbRows.forEach(r=>{ if(cnt[r.sector]!=null) cnt[r.sector]++; });
  let h=`<button class="chip ${filterSec==='ALL'?'on':''}" data-sec="ALL">전체<span class="n">${dbRows.length}</span></button>`;
  h+=SECTOR_ORDER.map(s=>`<button class="chip ${filterSec===s?'on':''}" data-sec="${s}">${s}<span class="n">${cnt[s]||0}</span></button>`).join('');
  $('secChips').innerHTML=h;
  $('secChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filterSec=b.dataset.sec; renderSecChips(); render(); });
}
function bindModals(){
  ['addMonthBg','manualBg'].forEach(id=>{
    const el=$(id);
    el.addEventListener('mousedown', e=>{ if(e.target===el) closeModal(id); });
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeModal('addMonthBg'); closeModal('manualBg'); }
  });
}
function bindFilters(){
  $('search').addEventListener('input',()=>{ searchTxt=$('search').value; render(); });
  $('prodSel').onchange=()=>{ prodFilter=$('prodSel').value; render(); };
  $('chkAll').onchange=()=>{ const on=$('chkAll').checked;
    document.querySelectorAll('#leftBody .row-chk').forEach(c=>c.checked=on); };
}

/* ---------- 메타(유니버스/판매가능) ---------- */
function metaOf(r){ const m=META[rowKey(r)]||{}; return {universe:m.universe==='N'?'N':'Y', precheck:m.precheck==='Y'?'Y':'N', sellable:m.sellable!==false}; }
function saveMeta(r,patch){
  const key=rowKey(r);
  const cur=metaOf(r);
  const next=Object.assign({},cur,patch);
  META[key]=next;
  fetch('/api/proposal_meta',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({key},patch))}).catch(()=>toast('메타 저장 실패','err'));
}
function toggleUniverse(i){ const r=filteredRows()[i]; const m=metaOf(r); saveMeta(r,{universe:m.universe==='Y'?'N':'Y'}); render(); }
function togglePrecheck(i){ const r=filteredRows()[i]; const m=metaOf(r); saveMeta(r,{precheck:m.precheck==='Y'?'N':'Y'}); render(); }
function toggleSellable(i){ const r=filteredRows()[i]; const m=metaOf(r); saveMeta(r,{sellable:!m.sellable}); render(); }

/* ---------- 렌더 ---------- */
function render(){ renderLeft(); renderRight(); }
function renderLeft(){
  const rows=filteredRows();
  $('leftSub').textContent=rows.length+'건';
  if(!rows.length){ $('leftBody').innerHTML='<tr class="none-row"><td colspan="9">조건에 맞는 상품이 없습니다.</td></tr>'; $('chkAll').checked=false; return; }
  $('leftBody').innerHTML=rows.map((r,i)=>{
    const m=metaOf(r);
    const uCls=m.universe==='Y'?'y':'n';
    const pCls=m.precheck==='Y'?'y':'n';
    const sCls=m.sellable?'sell':'nosell';
    const sTxt=m.sellable?'판매가능':'판매불가';
    return `<tr>
      <td><input type="checkbox" class="chk row-chk" data-i="${i}"></td>
      <td><span class="badge-sec s-${r.sector}">${r.sector}</span></td>
      <td class="l org" title="${htmlEsc(r.org)}">${htmlEsc(r.org)}</td>
      <td class="l" title="${htmlEsc(r.fam)}">${htmlEsc(r.fam)}</td>
      <td><button class="tgl ${uCls}" onclick="toggleUniverse(${i})">${m.universe}</button></td>
      <td><button class="tgl ${pCls}" onclick="togglePrecheck(${i})">${m.precheck}</button></td>
      <td><button class="tgl ${sCls}" onclick="toggleSellable(${i})">${sTxt}</button></td>
      <td>${htmlEsc(r.period)}</td>
      <td class="rate">${fmtRate(r.rate)}</td>
    </tr>`;
  }).join('');
  $('chkAll').checked=false;
}
function renderRight(){
  $('rightSub').textContent=selected.length+'건';
  if(!selected.length){ $('rightBody').innerHTML='<tr class="none-row"><td colspan="5">왼쪽에서 상품을 선택하고 ▶ 를 누르거나, 아래 「＋ 직접 추가」로 입력하세요.</td></tr>'; return; }
  // 금리는 직접 수정 가능(금리 데이터 없이 만든 기준월·수기 입력 상품을 위해)
  $('rightBody').innerHTML=selected.map((r,i)=>`<tr>
    <td class="l org">${htmlEsc(r.org)}</td>
    <td class="l">${htmlEsc(r.fam)}</td>
    <td>${htmlEsc(r.period||MONTH_LABEL[r.months]||'')}</td>
    <td class="rate"><input class="rate-in${r.rate==null?' empty':''}" type="number" step="0.01" min="0"
        value="${r.rate==null?'':r.rate}" data-i="${i}" placeholder="입력" title="이 달의 실제 금리를 입력하세요"></td>
    <td class="del" title="제거" onclick="removeSelected(${i})">✕</td>
  </tr>`).join('');
  $('rightBody').querySelectorAll('.rate-in').forEach(inp=>{
    inp.onchange=inp.onblur=()=>{
      const i=+inp.dataset.i, v=inp.value.trim();
      selected[i].rate = v===''? null : Math.round(parseFloat(v)*100)/100;
      if(isNaN(selected[i].rate)) selected[i].rate=null;
      inp.classList.toggle('empty', selected[i].rate==null);
    };
  });
}

/* ---------- 선택 → 제안 이동 ---------- */
function addSelected(){
  const rows=filteredRows();
  const picks=[...document.querySelectorAll('#leftBody .row-chk:checked')].map(c=>rows[+c.dataset.i]);
  if(!picks.length){ toast('먼저 상품을 선택하세요'); return; }
  let added=0;
  picks.forEach(r=>{
    const key=rowKey(r);
    if(selected.some(s=>rowKey(s)===key)) return;   // 중복 방지
    selected.push({sector:r.sector,org:r.org,fam:r.fam,months:r.months,period:r.period,rate:r.rate});
    added++;
  });
  render();
  toast(added?`${added}건을 제안 목록에 추가했습니다`:'이미 추가된 상품입니다');
}
function removeSelected(i){ selected.splice(i,1); render(); }

/* ---------- 등록 / 수정 ---------- */
function loadProposalsForMonth(){ selected=(PROPOSALS[curMonth]||[]).map(x=>Object.assign({},x)); }
function reloadProposals(){ loadProposalsForMonth(); render(); toast('저장된 제안 목록을 불러왔습니다'); }
async function registerProposals(){
  if(!curMonth){ toast('기준월이 없습니다. 「＋ 기준월 추가」로 먼저 만들어주세요','err'); return; }
  const blanks=selected.filter(r=>r.rate==null).length;
  if(blanks && !confirm(`금리가 비어 있는 항목이 ${blanks}건 있습니다. 모바일 화면에 '-'로 표시됩니다. 그대로 등록할까요?`)) return;
  try{
    const res=await fetch('/api/proposals',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({month:curMonth,items:selected})});
    const d=await res.json();
    if(d.success){ PROPOSALS[curMonth]=selected.map(x=>Object.assign({},x)); toast(`${curMonth} 제안상품 ${d.count}건을 등록했습니다`); }
    else toast(d.message||'등록 실패','err');
  }catch(e){ toast('서버와 통신하지 못했습니다','err'); }
}

boot();
</script>
</body>
</html>
