<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>마이페이지 · 저장한 제안상품</title>
<style>
  /* 마이페이지(모바일 하단탭) — 제안상품 찾기에서 저장한 결과를 제안상품 기준월별로 조회·삭제.
     본인 저장분만 보이며, 기준월이 지나면 서버에서 자동 삭제된다. */
  :root{--navy:#043B72;--orange:#F58220;--orange-soft:#FEF0E2;--ink:#1F2937;--muted:#6B7280;
        --line:#E5E7EB;--bg:#F5F6F8;--chip:#F1F3F6;--good:#1E7F4F}
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
  .ttl h1{font-size:19px;font-weight:800;color:var(--navy)}
  .ttl small{font-size:12px;color:var(--muted);white-space:nowrap}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 12px}
  .ava{width:52px;height:52px;flex:0 0 auto;border-radius:50%;object-fit:cover;background:var(--orange-soft);border:2px solid var(--orange-soft)}
  .me b{font-size:15.5px;min-width:0}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:700;
        color:var(--ink);cursor:pointer;font-family:inherit}
  .chip.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
  .chip:focus-visible,.del:focus-visible,.cf button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .c-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .c-h b{font-size:14.5px}
  .del{border:none;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 2px}
  .grp{font-size:12px;font-weight:800;color:var(--navy);margin:8px 0 4px}
  .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .it .nm{min-width:0}
  .it .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .nm small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gr{display:inline-block;font-size:10.5px;font-weight:800;color:var(--good);background:#E8F5EE;border-radius:5px;padding:0 5px;margin-right:4px}
  .rt{font-size:15px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rt .sc{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-align:right;margin-top:1px}
  .rt small{font-size:10.5px;color:var(--muted);font-weight:600;margin-right:2px}
  .cf{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:13px;color:#B4561A;font-weight:700}
  .cf button{border:none;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .cf .yes{background:#B4561A;color:#fff}
  .cf .no{background:var(--chip);color:var(--ink)}
  .none{background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center;color:var(--muted);padding:34px 16px;font-size:14px;line-height:1.7}
  .none b{color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F2647;color:#fff;padding:10px 18px;
         border-radius:22px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;white-space:nowrap}
  #toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ttl"><h1>마이페이지</h1><small>저장한 제안상품</small></div>
  <div class="me" id="me" hidden><img class="ava" src="/static/images/mypage_avatar.png?v=1" alt=""><b id="meName"></b></div>
  <p class="sub">최종 저장한 제안상품입니다 · 기준월이 지나면 자동 삭제됩니다</p>
  <div class="chips" id="months"></div>
  <div id="list"><div class="none">불러오는 중…</div></div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _tt;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),2000); }
const MONTH_LABEL={3:'3개월',6:'6개월',12:'1년',18:'18개월',24:'2년',30:'30개월',36:'3년',48:'4년',60:'5년'};
const gradeLabel=g=>g==='AA'?'AA0':(g==='A'?'A0':(g==='BBB'?'BBB0':(g==='ALL'?'무관':g)));
const ymLabel=ym=>String(ym).slice(0,4)+'.'+String(ym).slice(5,7);

/* GIC(이율보증형보험, 연복리) 단리환산: ((1+금리/100)^년-1)/년*100 — pension.html simpleConv와 동일 */
function simpleConv(rate,months){ const y=(+months)/12; if(!(y>0)||typeof rate!=='number') return null; return (Math.pow(1+rate/100,y)-1)/y*100; }
let ITEMS=[], cur='', confirmId='';

async function load(){
  try{
    const r=await fetch('/api/my_proposals',{cache:'no-store'});
    const d=await r.json();
    ITEMS=(d&&d.items)||[];
    const me=(d&&d.me)||{};
    if(me.name){ $('meName').textContent=me.name+(me.affiliation?' (소속 : '+me.affiliation+')':''); $('me').hidden=false; }
  }catch(e){ ITEMS=[]; toast('불러오지 못했습니다'); }
  const ms=[...new Set(ITEMS.map(x=>x.month))].sort().reverse();
  if(!ms.includes(cur)) cur=ms[0]||'';
  render();
}
function render(){
  const ms=[...new Set(ITEMS.map(x=>x.month))].sort().reverse();
  $('months').innerHTML=ms.map(m=>`<button class="chip${m===cur?' on':''}" onclick="pickMonth('${m}')">${ymLabel(m)}</button>`).join('');
  $('months').hidden=!ms.length;
  if(!ms.length){
    $('list').innerHTML=`<div class="none"><b>저장한 제안상품이 없습니다.</b><br>하단 메뉴 「상품제안」에서 조건을 고른 뒤<br>「제안상품 저장」을 누르면 여기에 모입니다.</div>`;
    return;
  }
  $('list').innerHTML=ITEMS.filter(x=>x.month===cur).map(x=>{
    const dt=String(x.saved_at||'');
    const groups=[]; (x.items||[]).forEach(it=>{
      const k=it.cat+' '+(MONTH_LABEL[it.months]||it.period||'');
      let g=groups.find(z=>z.k===k); if(!g){ g={k,rows:[]}; groups.push(g); } g.rows.push(it); });
    const body=groups.map(g=>`<div class="grp">${esc(g.k)}</div>`+g.rows.map(it=>
      `<div class="it"><div class="nm"><b>${esc(it.org)}</b><small><span class="gr">${esc(gradeLabel(it.grade)||'-')}</span>${esc(it.fam)} · ${esc(it.period||MONTH_LABEL[it.months]||'')}</small></div>`+
      `<div class="rt"><small>연</small>${typeof it.rate==='number'?it.rate.toFixed(2)+'%':'-'}${it.cat==='GIC'&&simpleConv(it.rate,it.months)!=null?`<span class="sc">단리환산 ${simpleConv(it.rate,it.months).toFixed(2)}%</span>`:''}</div></div>`).join('')).join('');
    const cf=confirmId===x.id
      ? `<div class="cf">이 저장분을 삭제할까요?<button class="no" onclick="askDel('')">취소</button><button class="yes" onclick="doDel('${esc(x.id)}')">삭제</button></div>`:'';
    return `<div class="card"><div class="c-h"><b>${esc(dt.slice(5,7)+'.'+dt.slice(8,10)+' '+dt.slice(11,16))} 저장</b>`+
      `<button class="del" onclick="askDel('${esc(x.id)}')">삭제</button></div>`+
      `${body}${cf}</div>`;
  }).join('');
}
function pickMonth(m){ cur=m; confirmId=''; render(); window.scrollTo(0,0); }
function askDel(id){ confirmId=id; render(); }
async function doDel(id){
  try{
    const r=await fetch('/api/my_proposals/'+encodeURIComponent(id),{method:'DELETE'});
    if(!r.ok) throw new Error('서버 '+r.status);
    ITEMS=ITEMS.filter(x=>x.id!==id); confirmId=''; toast('삭제했습니다');
    const ms=[...new Set(ITEMS.map(x=>x.month))].sort().reverse(); if(!ms.includes(cur)) cur=ms[0]||'';
    render();
  }catch(e){ toast('삭제하지 못했습니다'); }
}
load();
</script>
</body>
</html>
