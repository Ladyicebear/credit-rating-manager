<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비밀번호변경 · 퇴직연금 원리금보장상품 Mobile 서비스</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;color:#222;
     min-height:100vh;background:#F7F4EF url('/static/images/login_bg.png') no-repeat center top;background-size:cover}
.lg-wrap{min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.lg-top{padding:40px 28px 0;box-sizing:border-box}
.lg-logo{height:30px;width:auto;display:block;margin-bottom:20px}
.lg-title{font-size:1.35rem;font-weight:800;color:#1a1a1a;letter-spacing:-.5px}
.lg-sub{font-size:.9rem;color:#9298a1;margin-top:9px;font-weight:500}
.lg-card{background:#fff;border-radius:22px;margin:24px 16px 24px;padding:26px 22px 22px;
         box-shadow:0 12px 44px rgba(90,66,30,.16)}
.lg-err{background:#fff0f0;border:1px solid #f5c6cb;color:#c0392b;border-radius:10px;
        padding:10px 12px;font-size:.8rem;margin-bottom:16px;text-align:center;line-height:1.5}
.lg-info{background:#eef5ff;border:1px solid #cadcf5;color:#1c4e8a;border-radius:10px;
         padding:11px 13px;font-size:.82rem;margin-bottom:16px;text-align:center;line-height:1.5}
.fg{margin-bottom:15px}
.fg label{display:block;font-size:.9rem;font-weight:800;color:#333;margin-bottom:8px}
.fg input{width:100%;padding:14px;border:1px solid #e6e8ec;border-radius:12px;background:#fff;
        font-size:.95rem;color:#222;font-family:inherit}
.fg input::placeholder{color:#b6bbc2}
.fg input:focus{outline:none;border-color:#F58220;box-shadow:0 0 0 3px rgba(245,130,32,.12)}
.lg-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#F58220;color:#fff;
        font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:6px}
.lg-btn:hover{background:#CB6015}
.lg-back{display:block;text-align:center;margin-top:16px;font-size:.84rem;font-weight:700;
         color:#8a8f98;text-decoration:none}
.lg-back:hover{color:#F58220;text-decoration:underline}
.lg-foot{text-align:center;margin-top:16px;font-size:.72rem;color:#b6bbc2;font-weight:500}
@media(min-width:768px){
  body{background:#F3EEE6 url('/static/images/login_bg2.png') no-repeat center center;background-size:cover}
  .lg-wrap{max-width:620px;padding:36px 24px;justify-content:center}
  .lg-logo{height:48px}
  .lg-title{font-size:1.8rem}
  .lg-card{max-width:520px;margin:24px auto;padding:38px 46px 30px;border-radius:24px}
  .fg input{padding:16px;font-size:1rem;border-radius:14px}
  .lg-btn{padding:17px;font-size:1.08rem;border-radius:14px}
}
</style>
</head>
<body>
  <div class="lg-wrap">
    <div class="lg-top">
      <img class="lg-logo" src="/static/images/smart_future.png" alt="SMART PENSION"/>
      <div class="lg-title">비밀번호변경</div>
      <div class="lg-sub">
        {% if step == 'new' %}새 비밀번호를 설정해 주세요.
        {% else %}가입하신 회사 이메일을 입력하시면 인증코드를 보내드립니다.{% endif %}
      </div>
    </div>

    <div class="lg-card">
      {% if error %}<div class="lg-err">{{ error }}</div>{% endif %}
      {% if info %}<div class="lg-info">{{ info }}</div>{% endif %}

      {% if step == 'new' %}
      <form method="POST" action="{{ url_for('password_set') }}">
        <div class="fg">
          <label for="password">새 비밀번호</label>
          <input type="password" id="password" name="password" placeholder="8자 이상 입력하세요" autocomplete="new-password" required/>
        </div>
        <div class="fg">
          <label for="password_confirm">비밀번호 확인</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required/>
        </div>
        <button type="submit" class="lg-btn">설정 완료</button>
      </form>
      {% else %}
      <form method="POST" action="{{ url_for('password_change') }}">
        <div class="fg">
          <label for="email">회사 이메일</label>
          <input type="email" id="email" name="email" placeholder="name@miraeasset.com" autocomplete="email" required/>
        </div>
        <button type="submit" class="lg-btn">인증코드 받기</button>
      </form>
      {% endif %}
      <a class="lg-back" href="{{ url_for('login') }}">← 로그인 화면으로</a>
      <div class="lg-foot">System Designed &amp; Built by Goun</div>
    </div>
  </div>
</body>
</html>
