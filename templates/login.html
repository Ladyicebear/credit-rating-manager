<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>로그인 · 퇴직연금 원리금보장상품 Mobile 서비스</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;color:#222;
     min-height:100vh;background:#F7F4EF url('/static/images/login_bg.png') no-repeat center top;background-size:cover}
.lg-wrap{min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
/* 상단: 로고 + 타이틀 */
.lg-top{padding:40px 28px 0;min-height:40vh;box-sizing:border-box}
.lg-logo{height:30px;width:auto;display:block;margin-bottom:20px}
.lg-title{font-size:1.4rem;font-weight:800;color:#1a1a1a;letter-spacing:-.5px;line-height:1.3}
.lg-title .m{color:#F58220}
.lg-sub{font-size:.92rem;color:#9298a1;margin-top:10px;font-weight:500}
.lg-spacer{flex:none;min-height:0}
/* 카드 */
.lg-card{background:#fff;border-radius:22px;margin:24px 16px 18px;padding:26px 22px 20px;
         box-shadow:0 12px 44px rgba(90,66,30,.16)}
.lg-err{background:#fff0f0;border:1px solid #f5c6cb;color:#c0392b;border-radius:10px;
        padding:10px 12px;font-size:.8rem;margin-bottom:16px;text-align:center}
.fg{margin-bottom:15px}
.fg label{display:block;font-size:.92rem;font-weight:800;color:#333;margin-bottom:8px}
.inp{position:relative}
.inp .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9aa0a8;display:flex}
.inp .ic svg{width:18px;height:18px}
.inp input{width:100%;padding:14px 44px 14px 42px;border:1px solid #e6e8ec;border-radius:12px;
           background:#fff;font-size:.95rem;color:#222;font-family:inherit}
.inp input::placeholder{color:#b6bbc2}
.inp input:focus{outline:none;border-color:#F58220;box-shadow:0 0 0 3px rgba(245,130,32,.12)}
.inp .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
          color:#9aa0a8;cursor:pointer;padding:5px;display:flex}
.inp .eye svg{width:19px;height:19px}
.lg-remember{display:flex;align-items:center;gap:8px;font-size:.86rem;color:#555;font-weight:600;
             margin:4px 2px 18px;cursor:pointer;user-select:none}
.lg-remember input{width:17px;height:17px;accent-color:#F58220;margin:0}
.lg-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#F58220;color:#fff;
        font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.2px}
.lg-btn:hover{background:#CB6015}
.lg-pwlink{display:block;width:100%;margin-top:15px;background:none;border:none;font-family:inherit;
           font-size:.82rem;font-weight:700;color:#8a8f98;text-decoration:underline;cursor:pointer}
.lg-pwlink:hover{color:#F58220}
.lg-foot{text-align:center;margin-top:16px;font-size:.72rem;color:#b6bbc2;font-weight:500}
/* 비밀번호 만료 팝업 */
.exp-ov{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;align-items:center;justify-content:center;padding:20px}
.exp-card{background:#fff;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.35);width:340px;max-width:100%;padding:28px 26px 22px;text-align:center}
.exp-card .exp-ico{font-size:2rem}
.exp-card .exp-msg{font-size:.9rem;font-weight:700;color:#16335B;line-height:1.5;margin:12px 0 20px}
.exp-card .exp-ok{width:100%;padding:11px;border:none;border-radius:8px;background:#F58220;color:#fff;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit}
.exp-card .exp-ok:hover{background:#CB6015}
/* 비밀번호 변경 모달 */
.pw-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:20px}
.pw-ov.open{display:flex}
.pw-card{background:#fff;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.3);width:360px;max-width:100%;padding:26px 30px 22px}
.pw-card h2{font-size:1rem;font-weight:800;color:#16335B;margin-bottom:18px;text-align:center}
.pw-card .fg label{font-size:.8rem;color:#555;font-weight:700;margin-bottom:5px}
.pw-card .fg input{width:100%;padding:10px 12px;border:1px solid #dde3ec;border-radius:8px;font-size:.9rem;font-family:inherit}
.pw-card .fg input:focus{outline:none;border-color:#F58220;box-shadow:0 0 0 3px rgba(245,130,32,.15)}
.pw-hint{font-size:.68rem;color:#8a92a0;margin-top:4px}
.pw-msg{display:none;margin-top:12px;padding:9px 12px;border-radius:8px;font-size:.72rem;font-weight:600;text-align:center}
.pw-msg.show{display:block}
.pw-msg.err{background:#fff0f0;border:1px solid #f5c6cb;color:#c0392b}
.pw-msg.ok{background:#eaf6ee;border:1px solid #bfe0cb;color:#1c6b3a}
.pw-foot{display:flex;gap:8px;margin-top:16px}
.pw-foot button{flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
.pw-cancel{background:#eee;color:#555}
.pw-cancel:hover{background:#e2e2e2}
.pw-save{background:#F58220;color:#fff}
.pw-save:hover{background:#CB6015}
.pw-save:disabled{background:#f0b988;cursor:default}
</style>
</head>
<body>
  <div class="lg-wrap">
    <div class="lg-top">
      <img class="lg-logo" src="/static/images/smart_future.png" alt="SMART FUTURE"/>
      <div class="lg-title">퇴직연금 원리금보장상품<br><span class="m">Mobile 서비스</span></div>
      <div class="lg-sub">로그인이 필요합니다</div>
    </div>
    <div class="lg-spacer"></div>

    <form class="lg-card" method="POST" action="{{ url_for('login', next=request.args.get('next','')) }}">
      {% if error %}<div class="lg-err">{{ error }}</div>{% endif %}

      <div class="fg">
        <label for="username">아이디</label>
        <div class="inp">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6.2 8-6.2s8 2.2 8 6.2"/></svg></span>
          <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" autocomplete="username" required/>
        </div>
      </div>

      <div class="fg">
        <label for="password">비밀번호</label>
        <div class="inp">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
          <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required/>
          <button type="button" class="eye" id="eyeBtn" onclick="toggleEye()" aria-label="비밀번호 표시">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <label class="lg-remember"><input type="checkbox" id="remember"/> 아이디 저장</label>

      <button type="submit" name="view" value="web" class="lg-btn">로그인</button>
      <button type="button" class="lg-pwlink" onclick="openPw()">비밀번호 변경</button>

      <div class="lg-foot">System Designed &amp; Built by Goun</div>
    </form>
  </div>

  {% if rm_expired %}
  <!-- RM 비밀번호 사용기간 만료 팝업 -->
  <div class="exp-ov" id="exp-ov" onclick="if(event.target===this)this.remove()">
    <div class="exp-card">
      <div class="exp-ico">🔒</div>
      <div class="exp-msg">비밀번호 사용 기간이 만료되었습니다.<br>연금컨설팅팀으로 문의바랍니다.</div>
      <button type="button" class="exp-ok" onclick="document.getElementById('exp-ov').remove()">확인</button>
    </div>
  </div>
  {% endif %}

  <!-- 비밀번호 변경(로그인 전에도 가능 — 아이디+현재 비밀번호를 알아야 통과) -->
  <div class="pw-ov" id="pw-ov" onclick="if(event.target===this)closePw()">
    <div class="pw-card">
      <h2>🔑 비밀번호 변경</h2>
      <div class="fg">
        <label for="pw-user">아이디</label>
        <input type="text" id="pw-user" autocomplete="username"/>
      </div>
      <div class="fg">
        <label for="pw-cur">현재 비밀번호</label>
        <input type="password" id="pw-cur" autocomplete="current-password"/>
      </div>
      <div class="fg">
        <label for="pw-new">새 비밀번호</label>
        <input type="password" id="pw-new" autocomplete="new-password"/>
        <div class="pw-hint">8자 이상으로 설정하세요.</div>
      </div>
      <div class="fg">
        <label for="pw-confirm">새 비밀번호 확인</label>
        <input type="password" id="pw-confirm" autocomplete="new-password"/>
      </div>
      <div class="pw-msg" id="pw-msg"></div>
      <div class="pw-foot">
        <button type="button" class="pw-cancel" onclick="closePw()">취소</button>
        <button type="button" class="pw-save" id="pw-save" onclick="submitPw()">변경</button>
      </div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
/* 비밀번호 보기/숨기기 */
function toggleEye(){ const p=$('password'); p.type = (p.type==='password')?'text':'password'; }
/* 아이디 저장(체크 시 브라우저에 아이디 기억) */
(function(){
  try{ const s=localStorage.getItem('sf_saved_id'); if(s){ $('username').value=s; $('remember').checked=true; } }catch(e){}
})();
document.querySelector('.lg-card').addEventListener('submit',function(){
  try{ if($('remember').checked) localStorage.setItem('sf_saved_id',$('username').value.trim()); else localStorage.removeItem('sf_saved_id'); }catch(e){}
});
/* 비밀번호 변경 모달 */
function openPw(){
  ['pw-user','pw-cur','pw-new','pw-confirm'].forEach(id=>$(id).value='');
  $('pw-user').value=$('username').value.trim();
  pwMsg('');
  $('pw-ov').classList.add('open');
  ($('pw-user').value ? $('pw-cur') : $('pw-user')).focus();
}
function closePw(){ $('pw-ov').classList.remove('open'); }
function pwMsg(text,type){
  const el=$('pw-msg');
  el.textContent=text||'';
  el.className='pw-msg'+(text?` show ${type||'err'}`:'');
}
async function submitPw(){
  const user=$('pw-user').value.trim(), cur=$('pw-cur').value,
        nw=$('pw-new').value, cf=$('pw-confirm').value;
  if(!user||!cur||!nw||!cf){ pwMsg('모든 항목을 입력하세요.'); return; }
  const btn=$('pw-save');
  btn.disabled=true; pwMsg('');
  try{
    const res=await fetch('/api/change_password',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,current:cur,new:nw,confirm:cf})
    });
    const d=await res.json();
    if(d.success){
      pwMsg('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.','ok');
      setTimeout(()=>{ closePw(); $('password').value=''; $('password').focus(); },1400);
    }else{
      pwMsg(d.message||'변경에 실패했습니다.');
    }
  }catch(e){
    pwMsg('서버와 통신하지 못했습니다.');
  }finally{
    btn.disabled=false;
  }
}
$('pw-ov').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submitPw(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePw(); });
</script>
</body>
</html>
