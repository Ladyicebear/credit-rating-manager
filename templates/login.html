<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>로그인 · 퇴직연금 상품제공기관 통합관리</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#F68121; --orange-d:#e06d10;
  --navy:#16335B; --navy-2:#123E7C;
  --ink:#2b2f36; --muted:#8a92a0;
  --line:#e7ebf2; --bg:#f3f5f9;
}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
     display:flex;align-items:center;justify-content:center;padding:24px;
     background:
       radial-gradient(1100px 620px at 84% -8%, #fff2e6 0%, rgba(255,242,230,0) 60%),
       radial-gradient(900px 620px at 8% 108%, #e8eefc 0%, rgba(232,238,252,0) 62%),
       linear-gradient(180deg,#fbfcfe 0%, var(--bg) 100%);}

/* ── 배경 구름 캐릭터 (미래에셋 라이프 온보딩 하단 캐릭터 오마주) ── */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;opacity:.9;animation:float 7s ease-in-out infinite}
.cloud.c1{width:96px;left:7%;top:16%;animation-delay:0s}
.cloud.c2{width:120px;right:9%;top:22%;animation-delay:1.4s}
.cloud.c3{width:82px;left:13%;bottom:12%;animation-delay:.7s}
.cloud.c4{width:104px;right:12%;bottom:14%;animation-delay:2.1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:640px){.cloud.c1,.cloud.c2{display:none}.cloud.c3{width:64px}.cloud.c4{width:74px}}

/* ── 로그인 카드 ── */
.login-card{position:relative;z-index:1;background:#fff;border-radius:26px;
            box-shadow:0 24px 60px -18px rgba(22,51,91,.28), 0 4px 14px rgba(22,51,91,.06);
            width:392px;max-width:100%;padding:0 32px 34px;border:1px solid #eef1f6}

/* 상단 등급 바 감성의 그라데이션 헤더 */
.card-top{position:relative;margin:0 -32px 4px;padding:30px 32px 22px;text-align:center;
          border-radius:26px 26px 0 0;overflow:hidden;
          background:linear-gradient(180deg,#fff7ef 0%,#ffffff 100%)}
.brand-mark{width:74px;height:74px;margin:0 auto 12px;border-radius:22px;display:block;
            box-shadow:0 10px 24px -8px rgba(246,129,33,.5);object-fit:cover}
.brand-org{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--orange);
           text-transform:uppercase;margin-bottom:2px}
.brand-title{font-size:1.16rem;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.35}
.brand-sub{font-size:.74rem;color:var(--muted);margin-top:7px;letter-spacing:-.2px}
/* 오렌지→핑크→블루 그라데이션 바 (스크린샷 등급 게이지 감성) */
.grade-bar{height:7px;border-radius:99px;margin:18px 4px 0;
           background:linear-gradient(90deg,#F9A03F 0%,#F86F5B 32%,#C24DD0 60%,#6E7BF2 82%,#4FA9F5 100%)}

/* ── 폼 ── */
.form-body{padding-top:22px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:.74rem;font-weight:700;color:#5b6472}
.fg input{padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:.92rem;
          background:#fafbfd;transition:border-color .15s,box-shadow .15s,background .15s;font-family:inherit}
.fg input::placeholder{color:#c2c8d2}
.fg input:focus{outline:none;border-color:var(--orange);background:#fff;
                box-shadow:0 0 0 4px rgba(246,129,33,.14)}
.btn-login{width:100%;padding:13px;border:none;border-radius:12px;color:#fff;
           font-size:.94rem;font-weight:800;cursor:pointer;margin-top:6px;letter-spacing:.02em;
           background:linear-gradient(135deg,#F79A34 0%,var(--orange) 100%);
           box-shadow:0 10px 22px -8px rgba(246,129,33,.6);transition:filter .15s,transform .08s}
.btn-login:hover{filter:brightness(1.05)}
.btn-login:active{transform:translateY(1px)}
.err{background:#fff2f2;border:1px solid #f6cdd0;color:#c0392b;border-radius:12px;
     padding:10px 12px;font-size:.76rem;margin-bottom:14px;text-align:center;font-weight:600}
.pw-link{display:block;width:100%;margin-top:16px;background:none;border:none;font-family:inherit;
         font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer}
.pw-link:hover{color:var(--orange)}
.foot{display:flex;align-items:center;justify-content:center;gap:7px;
      margin-top:20px;padding-top:16px;border-top:1px solid #f0f2f6;
      font-size:.66rem;color:#b3bac4;font-weight:600}
.foot .dot{width:4px;height:4px;border-radius:50%;background:#d7dce4}

/* ── 비밀번호 만료 팝업 ── */
.exp-ov{display:flex;position:fixed;inset:0;background:rgba(20,31,53,.5);z-index:60;
        backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:20px}
.exp-card{background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);
          width:340px;max-width:100%;padding:30px 26px 24px;text-align:center}
.exp-card .exp-ico{font-size:2.1rem}
.exp-card .exp-msg{font-size:.9rem;font-weight:700;color:var(--navy);line-height:1.55;margin:14px 0 22px}
.exp-card .exp-ok{width:100%;padding:12px;border:none;border-radius:12px;color:#fff;
                  font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit;
                  background:linear-gradient(135deg,#F79A34,var(--orange))}
.exp-card .exp-ok:hover{filter:brightness(1.05)}

/* ── 비밀번호 변경 ── */
.pw-ov{display:none;position:fixed;inset:0;background:rgba(20,31,53,.46);z-index:50;
       backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:20px}
.pw-ov.open{display:flex}
.pw-card{background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);
         width:372px;max-width:100%;padding:28px 30px 24px}
.pw-card h2{font-size:1.02rem;font-weight:800;color:var(--navy);margin-bottom:20px;text-align:center}
.pw-hint{font-size:.68rem;color:var(--muted);margin-top:3px}
.pw-msg{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.72rem;
        font-weight:600;text-align:center}
.pw-msg.show{display:block}
.pw-msg.err{background:#fff2f2;border:1px solid #f6cdd0;color:#c0392b}
.pw-msg.ok{background:#eaf6ee;border:1px solid #bfe0cb;color:#1c6b3a}
.pw-foot{display:flex;gap:9px;margin-top:18px}
.pw-foot button{flex:1;padding:11px;border:none;border-radius:12px;font-family:inherit;
                font-size:.84rem;font-weight:800;cursor:pointer}
.pw-cancel{background:#eef0f4;color:#5b6472}
.pw-cancel:hover{background:#e4e7ee}
.pw-save{background:linear-gradient(135deg,#F79A34,var(--orange));color:#fff}
.pw-save:hover{filter:brightness(1.05)}
.pw-save:disabled{background:#f6c99a;cursor:default;filter:none}
</style>
</head>
<body>
  <!-- 배경 구름 캐릭터 -->
  <div class="sky" aria-hidden="true">
    <svg class="cloud c1" viewBox="0 0 120 84"><g fill="#cfe0f7"><ellipse cx="60" cy="54" rx="46" ry="26"/><circle cx="38" cy="42" r="20"/><circle cx="78" cy="40" r="24"/></g><g fill="#5b6472"><circle cx="50" cy="52" r="2.6"/><circle cx="70" cy="52" r="2.6"/></g><path d="M55 60 q5 5 10 0" stroke="#5b6472" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <svg class="cloud c2" viewBox="0 0 120 84"><g fill="#ffe0c2"><ellipse cx="60" cy="54" rx="46" ry="26"/><circle cx="40" cy="40" r="22"/><circle cx="82" cy="42" r="20"/></g><g fill="#5b6472"><circle cx="52" cy="52" r="2.6"/><circle cx="72" cy="52" r="2.6"/></g><path d="M56 59 q4 4 9 0" stroke="#5b6472" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <svg class="cloud c3" viewBox="0 0 120 84"><g fill="#d7e9d9"><ellipse cx="60" cy="54" rx="46" ry="26"/><circle cx="42" cy="42" r="21"/><circle cx="80" cy="40" r="22"/></g><g fill="#5b6472"><circle cx="52" cy="52" r="2.6"/><circle cx="72" cy="52" r="2.6"/></g><path d="M56 58 q5 5 10 0" stroke="#5b6472" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <svg class="cloud c4" viewBox="0 0 120 84"><g fill="#e6d9f5"><ellipse cx="60" cy="54" rx="46" ry="26"/><circle cx="40" cy="41" r="22"/><circle cx="80" cy="43" r="20"/></g><g fill="#5b6472"><circle cx="52" cy="53" r="2.6"/><circle cx="72" cy="53" r="2.6"/></g><path d="M56 60 q4 4 9 0" stroke="#5b6472" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
  </div>

  <form class="login-card" method="POST" action="{{ url_for('login', next=request.args.get('next','')) }}">
    <div class="card-top">
      <img class="brand-mark" src="{{ url_for('static', filename='images/goun_logo.png') }}" alt="Goun"/>
      <div class="brand-org">MIRAE ASSET · GOUN</div>
      <h1 class="brand-title">퇴직연금<br>상품제공기관 통합관리</h1>
      <p class="brand-sub">안전한 로그인이 필요한 서비스입니다</p>
      <div class="grade-bar"></div>
    </div>

    <div class="form-body">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}

      <div class="fg">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요"
               autocomplete="username" autofocus required/>
      </div>
      <div class="fg">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"
               autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn-login">로그인</button>
      <button type="button" class="pw-link" onclick="openPw()">비밀번호 변경</button>

      <div class="foot"><span>admin.Goun</span><span class="dot"></span><span>미래에셋증권 연금컨설팅팀</span></div>
    </div>
  </form>

  {% if rm_expired %}
  <!-- RM 비밀번호 사용기간 만료 팝업 -->
  <div class="exp-ov" id="exp-ov" onclick="if(event.target===this)this.remove()">
    <div class="exp-card">
      <div class="exp-ico">🔒</div>
      <div class="exp-msg">비밀번호 사용 기간이 만료되었습니다.<br>연금컨설팅팀으로 문의바랍니다.</div>
      <button type="button" class="exp-ok" onclick="document.getElementById('exp-ov').remove()">확인</button>
    </div>
  </div>
  {% endif %}

  <!-- 비밀번호 변경(로그인 전에도 가능 — 아이디+현재 비밀번호를 알아야 통과) -->
  <div class="pw-ov" id="pw-ov" onclick="if(event.target===this)closePw()">
    <div class="pw-card">
      <h2>🔑 비밀번호 변경</h2>
      <div class="fg">
        <label for="pw-user">아이디</label>
        <input type="text" id="pw-user" autocomplete="username"/>
      </div>
      <div class="fg">
        <label for="pw-cur">현재 비밀번호</label>
        <input type="password" id="pw-cur" autocomplete="current-password"/>
      </div>
      <div class="fg">
        <label for="pw-new">새 비밀번호</label>
        <input type="password" id="pw-new" autocomplete="new-password"/>
        <div class="pw-hint">8자 이상으로 설정하세요.</div>
      </div>
      <div class="fg">
        <label for="pw-confirm">새 비밀번호 확인</label>
        <input type="password" id="pw-confirm" autocomplete="new-password"/>
      </div>
      <div class="pw-msg" id="pw-msg"></div>
      <div class="pw-foot">
        <button type="button" class="pw-cancel" onclick="closePw()">취소</button>
        <button type="button" class="pw-save" id="pw-save" onclick="submitPw()">변경</button>
      </div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
function openPw(){
  ['pw-user','pw-cur','pw-new','pw-confirm'].forEach(id=>$(id).value='');
  $('pw-user').value=$('username').value.trim();   // 위에 입력한 아이디가 있으면 가져옴
  pwMsg('');
  $('pw-ov').classList.add('open');
  ($('pw-user').value ? $('pw-cur') : $('pw-user')).focus();
}
function closePw(){ $('pw-ov').classList.remove('open'); }
function pwMsg(text,type){
  const el=$('pw-msg');
  el.textContent=text||'';
  el.className='pw-msg'+(text?` show ${type||'err'}`:'');
}
async function submitPw(){
  const user=$('pw-user').value.trim(), cur=$('pw-cur').value,
        nw=$('pw-new').value, cf=$('pw-confirm').value;
  if(!user||!cur||!nw||!cf){ pwMsg('모든 항목을 입력하세요.'); return; }
  const btn=$('pw-save');
  btn.disabled=true; pwMsg('');
  try{
    const res=await fetch('/api/change_password',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,current:cur,new:nw,confirm:cf})
    });
    const d=await res.json();
    if(d.success){
      pwMsg('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.','ok');
      setTimeout(()=>{ closePw(); $('password').value=''; $('password').focus(); },1400);
    }else{
      pwMsg(d.message||'변경에 실패했습니다.');
    }
  }catch(e){
    pwMsg('서버와 통신하지 못했습니다.');
  }finally{
    btn.disabled=false;
  }
}
/* 모달 안에서 Enter=제출, ESC=닫기 */
$('pw-ov').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); submitPw(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePw(); });
</script>
</body>
</html>
