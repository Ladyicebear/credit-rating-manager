<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Smart pension</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#FAF1E8;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
/* 접속 인트로 영상(로그인 성공 직후 1회 재생 후 홈 화면으로 전환) */
.intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
.intro.out{opacity:0}
.intro video{width:100%;height:100%;object-fit:cover}
.intro-skip{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));padding:7px 14px;border:none;
            border-radius:999px;background:rgba(0,0,0,.28);color:#fff;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.intro-skip:hover{background:rgba(0,0,0,.42)}
@media(min-width:768px){
  .intro video{width:auto;max-width:100%;object-fit:contain}   /* 세로 영상 — 웹에선 잘리지 않게 */
}
</style>
</head>
<body>
  <div class="intro" id="intro">
    <video id="intro-video" src="/static/video/smartpension_intro.mp4" muted playsinline autoplay preload="auto"></video>
    <button type="button" class="intro-skip" id="intro-skip">건너뛰기</button>
  </div>
  <script>
  (function(){
    var next={{ next_url|tojson }};
    var ov=document.getElementById('intro'), v=document.getElementById('intro-video'), done=false;
    function go(){
      if(done) return; done=true;
      ov.classList.add('out');
      setTimeout(function(){ location.replace(next); },400);   // 뒤로가기로 영상에 돌아오지 않게 replace
    }
    v.addEventListener('ended',go);
    v.addEventListener('error',go);
    document.getElementById('intro-skip').addEventListener('click',go);
    setTimeout(go,10000);   // 로딩 지연/자동재생 차단 대비 안전장치
    var p=v.play(); if(p&&p.catch) p.catch(go);
  })();
  </script>
</body>
</html>
