<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>로그인 확인 · Smart pension</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f6f9;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;padding:20px}
  .card{background:#fff;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.12);
        width:360px;max-width:100%;padding:34px 28px 26px;text-align:center}
  .brand{font-size:1.05rem;font-weight:800;color:#043B72;margin:0 0 18px;letter-spacing:-.3px}
  h1{font-size:1.15rem;font-weight:800;color:#16335B;margin:0 0 10px}
  p.desc{font-size:.9rem;color:#55606c;line-height:1.6;margin:0 0 22px}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:#F58220;
       color:#fff;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.2px}
  .btn:hover{background:#CB6015}
  .hint{font-size:.75rem;color:#9298a1;margin:16px 2px 0;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <p class="brand">Smart pension</p>
    <h1>로그인 확인</h1>
    <p class="desc">본인 확인을 위해 아래 버튼을 눌러 로그인하세요.</p>
    <form method="POST" action="{{ url_for('auth_verify') }}">
      <input type="hidden" name="token" value="{{ token }}"/>
      <button type="submit" class="btn">로그인하기</button>
    </form>
    <p class="hint">회사 메일 보안이 링크를 미리 열어 로그인이<br>풀리는 것을 막기 위한 한 단계입니다.</p>
  </div>
</body>
</html>
